name: Gerar APK Android
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      server_url:
        description: "URL HTTPS do jogo publicado"
        required: false
        type: string
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extrair código do jogo
        run: node unpack.js
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Instalar Android SDK
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Compilar APK
        env:
          GAME_URL: ${{ github.event.inputs.server_url || 'https://batalha-turbo-online.onrender.com' }}
        run: |
          cd android
          gradle --no-daemon assembleDebug "-PgameUrl=$GAME_URL"
      - uses: actions/upload-artifact@v4
        with:
          name: Batalha-Turbo-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publicar APK para instalar no Android
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Batalha-Turbo-Android.apk
          if gh release view v1.0.0-beta >/dev/null 2>&1; then
            gh release upload v1.0.0-beta Batalha-Turbo-Android.apk --clobber
          else
            gh release create v1.0.0-beta Batalha-Turbo-Android.apk --title "Batalha Turbo para Android (beta)" --notes "APK de teste. Instalar manualmente no Android. Necessita de Internet e servidor online." --prerelease --target "$GITHUB_SHA"
          fi
